name: Build and Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Desktop Platforms
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: macos-15
            target: aarch64-apple-darwin
            test: true

          # Mobile Platforms (build only)
         # - os: ubuntu-latest
         #   target: aarch64-linux-android
         #   test: false
         # - os: macos-latest
         #   target: aarch64-apple-ios
         #   test: false
          # - os: macos-latest
          #   target: aarch64-apple-ios-sim
          #   test: false

    steps:
    - uses: actions/checkout@v4

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Build
      run: cargo build --workspace --release --target ${{ matrix.target }}

    - name: Install cargo-llvm-cov
      if: matrix.test == true && runner.os == 'Linux'
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Run tests with coverage (Linux)
      if: matrix.test == true && runner.os == 'Linux'
      run: cargo llvm-cov --workspace --target ${{ matrix.target }} --lcov --output-path lcov.info

    - name: Run tests (non-Linux)
      if: matrix.test == true && runner.os != 'Linux'
      run: cargo test --workspace --release --target ${{ matrix.target }}

    - name: Package Release Archive (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        set -euo pipefail
        TAG="${GITHUB_REF_NAME}"
        STAGE="x32-behringer-rust-${TAG}-${{ matrix.target }}"
        mkdir -p "${STAGE}" dist

        if [ "${{ runner.os }}" = "Windows" ]; then
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -name '*.exe' -exec cp {} "${STAGE}/" \;
        else
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f -perm -111 -exec cp {} "${STAGE}/" \;
        fi

        cp docs/examples/x32_config.volunteer.json "${STAGE}/x32_config.json"
        cp docs/USER_GUIDE.md "${STAGE}/USER_GUIDE.md"
        cp apps/x32_volunteer/README.md "${STAGE}/VOLUNTEER_README.md"

        if [ "${{ runner.os }}" = "Windows" ]; then
          7z a -tzip "dist/${STAGE}.zip" "${STAGE}"
        else
          tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"
        fi

        (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.target }}.txt")

    - name: Upload Release Archive
      if: startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: dist/

  publish_release:
    name: Publish GitHub Release
    needs: build_and_test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all release artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: release-assets
        merge-multiple: true

    - name: Combine checksums
      shell: bash
      run: |
        cat release-assets/SHA256SUMS-*.txt > release-assets/SHA256SUMS.txt
        rm -f release-assets/SHA256SUMS-*.txt
        ls -lh release-assets/

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        TAG="${GITHUB_REF_NAME}"
        PRERELEASE_FLAG=""
        if [[ "${TAG}" == *-* ]]; then
          PRERELEASE_FLAG="--prerelease"
        fi
        gh release create "${TAG}" release-assets/* \
          --title "${TAG}" \
          --generate-notes \
          ${PRERELEASE_FLAG}
