name: Relaxed CI for development branches

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-13, windows-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        components: clippy

    - name: Install portmidi on Linux
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libportmidi-dev libasound2-dev

    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y libasound2-dev

    - name: Run cargo check
      run: cargo check --workspace

    - name: Run cargo test
      run: cargo test --workspace
